<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Almanca A1 – Tüm Dersler</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--surface:#fff;--text:#2C2C3A;--muted:#7A7A8C;--border:#E0DCD5;
  --shadow:0 4px 20px rgba(44,44,58,.08);--green:#2E9E5A;--red:#D32F2F;--gold:#D4A017;
  --tab-bg:#2C2C3A;--tab-text:rgba(255,255,255,.6);--tab-active:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;padding-top:54px;padding-bottom:40px}

/* TAB BAR */
.tab-bar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;background:var(--tab-bg);box-shadow:0 2px 12px rgba(0,0,0,.15)}
.tab-btn{flex:1;border:none;background:none;color:var(--tab-text);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;padding:14px 6px 12px;cursor:pointer;transition:all .2s;border-bottom:3px solid transparent;white-space:nowrap}
.tab-btn:hover{color:rgba(255,255,255,.85)}
.tab-btn.active{color:var(--tab-active);border-bottom-color:var(--gold)}

/* LESSON PANELS */
.lesson-panel{display:none}
.lesson-panel.active{display:block}

/* SHARED HERO */
.lesson-hero{background:var(--tab-bg);color:#F4EFE6;padding:48px 24px 40px;text-align:center;position:relative;overflow:hidden}
.lesson-hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 38px,rgba(255,255,255,.015) 38px,rgba(255,255,255,.015) 39px)}
.lesson-hero .hero-icon{font-size:2.8rem;display:block;margin-bottom:12px}
.lesson-hero h1{font-family:'DM Serif Display',serif;font-size:2.6rem;font-weight:400;letter-spacing:-.5px;line-height:1.15}
.lesson-hero p{color:rgba(244,239,230,.5);margin-top:10px;font-size:.95rem}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.htag{border:1.5px solid rgba(244,239,230,.25);color:rgba(244,239,230,.65);font-size:.7rem;font-weight:700;letter-spacing:1.5px;padding:4px 12px;border-radius:20px;text-transform:uppercase}

/* WRAPPER */
.w{max-width:860px;margin:0 auto;padding:0 16px}

/* CARD */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:24px 26px;margin-bottom:20px;border:1px solid var(--border)}

/* SECTION TITLE */
.stitle{display:flex;align-items:center;gap:12px;margin:38px 0 14px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.snum{font-family:'DM Serif Display',serif;font-size:2rem;font-weight:400;color:var(--border);line-height:1;min-width:36px}
.stitle h3{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--text)}
.stitle h3 span{font-family:'Nunito',sans-serif;font-size:.8rem;color:var(--muted);font-weight:400;display:block;margin-top:2px}
.pill{margin-left:auto;font-size:.66rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0}

/* INFO */
.info{font-size:.82rem;color:var(--muted);margin-bottom:16px;background:rgba(0,0,0,.03);padding:8px 12px;border-radius:8px;border-left:3px solid var(--gold);line-height:1.6}
.info b{color:var(--text)}

/* BUTTONS */
.btn{display:inline-block;margin-top:16px;border:none;border-radius:10px;padding:10px 24px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;text-transform:uppercase;letter-spacing:.3px}
.btn:hover{opacity:.85;transform:translateY(-1px)}

/* TABLE WRAPPER for mobile scroll */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:6px}

/* ═══════════════════════════════════════ */
/* LESSON 1: Präteritum & Perfekt         */
/* ═══════════════════════════════════════ */
#lesson-1{--pret:#B03A2E;--perf:#1A5276;--l-gold:#9A7D0A}
#lesson-1 .lesson-hero h1 .pr{color:#E74C3C}
#lesson-1 .lesson-hero h1 .pe{color:#5DADE2}
#lesson-1 .lesson-hero h1 .am{color:#E6C84A}
#lesson-1 .htag.r{border-color:#E74C3C;color:#E74C3C}
#lesson-1 .htag.b{border-color:#5DADE2;color:#5DADE2}
#lesson-1 .pr-pill{background:rgba(176,58,46,.1);color:var(--pret);border:1px solid rgba(176,58,46,.3)}
#lesson-1 .pe-pill{background:rgba(26,82,118,.1);color:var(--perf);border:1px solid rgba(26,82,118,.3)}
#lesson-1 .bo-pill{background:rgba(154,125,10,.1);color:var(--l-gold);border:1px solid rgba(154,125,10,.3)}
#lesson-1 .btn-pr{background:var(--pret);color:#fff}
#lesson-1 .btn-pe{background:var(--perf);color:#fff}
#lesson-1 .btn-go{background:var(--l-gold);color:#fff}
