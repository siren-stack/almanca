<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanca Dersleri</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1C1814; color: #F4EFE6; overflow: hidden; }

  /* Top strip with menu button + current title */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px;
    display: flex; align-items: center; gap: 10px;
    background: #15110d; border-bottom: 2px solid #9A7D0A;
    padding: 0 12px; z-index: 30;
  }
  .menu-btn {
    background: transparent; border: none; color: #F4EFE6; cursor: pointer;
    width: 38px; height: 38px; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; padding: 0;
    transition: background .15s;
  }
  .menu-btn:hover { background: #2a241d; }
  .menu-btn svg { width: 22px; height: 22px; }
  .topbar-title {
    font-size: 15px; font-weight: 600; color: #F4EFE6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }

  /* Sliding side panel */
  .sidepanel {
    position: fixed; top: 0; left: 0; height: 100vh; width: 280px;
    background: #15110d; border-right: 2px solid #9A7D0A;
    transform: translateX(-100%); transition: transform .25s ease;
    z-index: 50; display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.4);
  }
  .sidepanel.open { transform: translateX(0); }
  .sidepanel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid #2a241d;
  }
  .sidepanel-title { font-size: 16px; font-weight: 600; letter-spacing: .3px; color: #F4EFE6; }
  .close-btn {
    background: transparent; border: none; color: #C8BFB1; cursor: pointer;
    width: 32px; height: 32px; border-radius: 6px; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { background: #2a241d; color: #F4EFE6; }

  .tabs { display: flex; flex-direction: column; padding: 8px; gap: 2px; overflow-y: auto; }
  .tab-btn {
    background: transparent; color: #C8BFB1; border: none;
    border-left: 3px solid transparent;
    padding: 12px 14px; font-size: 14px; font-family: inherit;
    cursor: pointer; text-align: left; border-radius: 6px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .tab-btn:hover { background: #2a241d; color: #F4EFE6; }
  .tab-btn.active {
    color: #F4EFE6; background: #2a241d;
    border-left-color: #B03A2E;
  }

  /* Backdrop */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 40;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  main {
    position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
    background: #F4EFE6; overflow: hidden;
  }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; display: none; background: #F4EFE6;
  }
  iframe.active { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Dersleri aç">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="topbar-title" id="topbarTitle">Almanca Dersleri</div>
</div>

<aside class="sidepanel" id="sidepanel" aria-hidden="true">
  <div class="sidepanel-header">
    <span class="sidepanel-title">Dersler</span>
    <button class="close-btn" id="closeBtn" aria-label="Kapat">&times;</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</aside>

<div class="backdrop" id="backdrop"></div>

<main id="main"></main>

<script>
  // GitHub API'den html/ klasöründeki .html dosyalarını otomatik çeker.
  // Yedek olarak sabit liste: API başarısız olursa (rate-limit, offline) bunlar kullanılır.
  const FALLBACK_LESSONS = [
    { file: 'remixed-f5625d65.html', title: 'Prima Plus A1.1 – Wiederholung' },
    { file: 'remixed-24aae99a.html', title: 'Präteritum & Perfekt' },
    { file: 'remixed-eafaa9dc.html', title: 'Dativ & Akkusativ' },
    { file: 'remixed-8f86e81f.html', title: 'Possessivpronomen' },
    { file: 'modalverben-a1.html', title: 'Modalverben · A1 Grammatik' }
  ];

  const REPO_API = 'https://api.github.com/repos/siren-stack/almanca/contents/html';

  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');
  const panel = document.getElementById('sidepanel');
  const backdrop = document.getElementById('backdrop');
  const menuBtn = document.getElementById('menuBtn');
  const closeBtn = document.getElementById('closeBtn');
  const topbarTitle = document.getElementById('topbarTitle');
  const idOf = (file) => file.replace(/\.html$/, '');

  let LESSONS = [];

  // Dosya adından okunabilir başlık üret
  function fileToTitle(name) {
    return name
      .replace(/\.html$/, '')
      .replace(/-[a-f0-9]{6,10}$/, '')
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  // Bir iframe yüklendikten sonra <title> etiketinden gerçek başlığı çek
  function extractTitle(frame, fallbackTitle) {
    try {
      const doc = frame.contentDocument;
      if (doc && doc.title) {
        const btn = tabsEl.querySelector('[data-id="' + frame.dataset.id + '"]');
        if (btn) btn.textContent = doc.title;
        const lesson = LESSONS.find(l => idOf(l.file) === frame.dataset.id);
        if (lesson) lesson.title = doc.title;
        if (frame.classList.contains('active')) {
          topbarTitle.textContent = doc.title;
          document.title = doc.title + ' · Almanca Dersleri';
        }
      }
    } catch (e) {}
  }

  function renderLessons(lessons) {
    LESSONS = lessons;
    tabsEl.innerHTML = '';
    mainEl.innerHTML = '';

    lessons.forEach((lesson) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.textContent = lesson.title;
      btn.dataset.id = idOf(lesson.file);
      btn.addEventListener('click', () => {
        location.hash = idOf(lesson.file);
        closePanel();
      });
      tabsEl.appendChild(btn);

      const frame = document.createElement('iframe');
      frame.dataset.id = idOf(lesson.file);
      frame.dataset.src = 'html/' + lesson.file;
      frame.title = lesson.title;
      frame.loading = 'lazy';
      frame.addEventListener('load', () => {
        injectMobileFix(frame);
        extractTitle(frame, lesson.title);
      });
      mainEl.appendChild(frame);
    });

    activate(location.hash.slice(1));
  }

  // HTML dosyasını hafifçe fetch edip <title> etiketini çek
  function fetchTitle(file) {
    return fetch('html/' + file)
      .then(r => r.text())
      .then(text => {
        const m = text.match(/<title>([^<]+)<\/title>/i);
        return m ? m[1] : fileToTitle(file);
      })
      .catch(() => fileToTitle(file));
  }

  // GitHub API'den dosya listesini çek, başarısız olursa fallback kullan
  fetch(REPO_API)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(files => {
      const htmlFiles = files.filter(f =>
        f.name.endsWith('.html') && /^[a-zA-Z0-9._\-]+$/.test(f.name)
      );
      if (!htmlFiles.length) return renderLessons(FALLBACK_LESSONS);
      // Tüm dosyaların gerçek <title>'ını paralel çek
      return Promise.all(
        htmlFiles.map(f =>
          fetchTitle(f.name).then(title => ({ file: f.name, title: title }))
        )
      ).then(lessons => renderLessons(lessons));
    })
    .catch(() => {
      renderLessons(FALLBACK_LESSONS);
    });

  // Runtime-inject mobile-friendly CSS into each iframe without touching source files.
  const MOBILE_FIX_CSS = `
    html, body { max-width: 100vw !important; overflow-x: hidden !important; }
    img, video, iframe, table, pre, code { max-width: 100% !important; height: auto; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 640px) {
      html { -webkit-text-size-adjust: 100%; }
      body { font-size: 15px; }
      .w, .sec, .card, .score-wrap, .gram-row, .progress-wrap, header, main, section, article {
        max-width: 100% !important;
        box-sizing: border-box;
      }
      .card { margin-left: 8px !important; margin-right: 8px !important; padding: 14px !important; }
      .gram-row, .mgrid, [class*="grid"] { grid-template-columns: 1fr !important; gap: 12px !important; }
      .timer-display { font-size: 1.3rem !important; min-width: 0 !important; }
      header, .topbar, .navbar { flex-wrap: wrap !important; row-gap: 8px; }
      button, .btn, input, select, textarea { max-width: 100%; }
      h1 { font-size: 1.6rem !important; }
      h2 { font-size: 1.25rem !important; }
      pre { white-space: pre-wrap !important; word-break: break-word; }
    }
  `;

  function injectMobileFix(frame) {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      if (!doc.querySelector('meta[name="viewport"]')) {
        const m = doc.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1';
        doc.head && doc.head.appendChild(m);
      }
      if (doc.getElementById('__mobile_fix__')) return;
      const style = doc.createElement('style');
      style.id = '__mobile_fix__';
      style.textContent = MOBILE_FIX_CSS;
      (doc.head || doc.documentElement).appendChild(style);
    } catch (e) {}
  }

  function openPanel() {
    panel.classList.add('open');
    backdrop.classList.add('show');
    panel.setAttribute('aria-hidden', 'false');
  }
  function closePanel() {
    panel.classList.remove('open');
    backdrop.classList.remove('show');
    panel.setAttribute('aria-hidden', 'true');
  }

  menuBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
  });

  function activate(id) {
    const target = LESSONS.find(l => idOf(l.file) === id) || LESSONS[0];
    const targetId = idOf(target.file);
    topbarTitle.textContent = target.title;
    document.title = target.title + ' · Almanca Dersleri';
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.id === targetId);
    });
    document.querySelectorAll('iframe').forEach(f => {
      const isActive = f.dataset.id === targetId;
      if (isActive && !f.src) f.src = f.dataset.src;
      f.classList.toggle('active', isActive);
    });
  }

  window.addEventListener('hashchange', () => activate(location.hash.slice(1)));
  activate(location.hash.slice(1));
</script>
</body>
</html>
